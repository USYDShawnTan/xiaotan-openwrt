name: Build OpenWrt

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'config/**'
      - 'files/**'
      - 'scripts/**'
      - 'versions.env'
      - '.github/workflows/build-openwrt.yml'

permissions:
  contents: write

concurrency:
  group: openwrt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools rsync unzip \
            zlib1g-dev file wget curl subversion swig time xsltproc xxd \
            libelf-dev liblzma-dev pkg-config ninja-build meson ccache zstd

      - name: Load versions
        shell: bash
        run: |
          set -a
          source versions.env
          set +a
          echo "OPENWRT_REF=$OPENWRT_REF" >> "$GITHUB_ENV"
          echo "ARGON_REF=$ARGON_REF" >> "$GITHUB_ENV"

      - name: Cache OpenWrt downloads
        uses: actions/cache@v4
        with:
          path: work/openwrt/dl
          key: openwrt-dl-${{ env.OPENWRT_REF }}-${{ hashFiles('config/xiaotan.config', 'versions.env') }}
          restore-keys: |
            openwrt-dl-${{ env.OPENWRT_REF }}-
            openwrt-dl-

      - name: Prepare OpenWrt
        run: ./scripts/prepare.sh "$GITHUB_WORKSPACE/work"

      - name: Download source archives
        working-directory: work/openwrt
        run: make download -j"$(nproc)"

      - name: Build firmware
        working-directory: work/openwrt
        run: |
          make -j"$(nproc)" || make -j1 V=s

      - name: Collect firmware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp work/openwrt/bin/targets/x86/64/*combined-efi.img.gz dist/
          cp work/openwrt/bin/targets/x86/64/sha256sums dist/
          cp config/xiaotan.config dist/
          cp versions.env dist/
          (cd dist && sha256sum *combined-efi.img.gz > xiaotan-firmware.sha256)
          ls -lh dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaotan-openwrt-${{ env.OPENWRT_REF }}-${{ github.run_number }}
          path: dist/
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release for tags
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "$TAG" \
              --generate-notes
          fi
