name: Build OpenWrt

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'config/**'
      - 'files/**'
      - 'scripts/**'
      - 'versions.env'
      - '.github/workflows/build-openwrt.yml'

permissions:
  contents: write

concurrency:
  group: openwrt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CCACHE_MAXSIZE: 1G

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools rsync unzip \
            zlib1g-dev file wget curl subversion swig time xsltproc xxd \
            libelf-dev liblzma-dev pkg-config ninja-build meson ccache zstd

      - name: Load versions
        shell: bash
        run: |
          set -a
          source versions.env
          set +a
          echo "OPENWRT_REF=$OPENWRT_REF" >> "$GITHUB_ENV"
          echo "ARGON_REF=$ARGON_REF" >> "$GITHUB_ENV"

      # Important: prepare/clone first. Restoring work/openwrt/* before cloning would
      # create a non-empty destination and cause "git clone" to fail.
      - name: Prepare OpenWrt
        run: bash ./scripts/prepare.sh "$GITHUB_WORKSPACE/work"

      - name: Cache OpenWrt downloads
        uses: actions/cache@v4
        with:
          path: work/openwrt/dl
          key: openwrt-dl-${{ env.OPENWRT_REF }}-${{ hashFiles('config/xiaotan.config', 'versions.env') }}
          restore-keys: |
            openwrt-dl-${{ env.OPENWRT_REF }}-
            openwrt-dl-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: work/openwrt/.ccache
          key: openwrt-ccache-${{ env.OPENWRT_REF }}-${{ hashFiles('config/xiaotan.config', 'versions.env') }}-${{ github.run_number }}
          restore-keys: |
            openwrt-ccache-${{ env.OPENWRT_REF }}-${{ hashFiles('config/xiaotan.config', 'versions.env') }}-
            openwrt-ccache-${{ env.OPENWRT_REF }}-
            openwrt-ccache-

      - name: Download source archives
        working-directory: work/openwrt
        run: make download -j"$(nproc)"

      - name: Build firmware
        working-directory: work/openwrt
        run: |
          make -j"$(nproc)" || make -j1 V=s

      - name: Show ccache statistics
        if: always()
        shell: bash
        run: |
          if [[ -x work/openwrt/staging_dir/host/bin/ccache ]]; then
            work/openwrt/staging_dir/host/bin/ccache -s || true
          elif command -v ccache >/dev/null 2>&1; then
            ccache -s || true
          fi

      - name: Verify firmware
        shell: bash
        run: |
          set -euo pipefail
          FIRMWARE="work/openwrt/bin/targets/x86/64/openwrt-x86-64-generic-squashfs-combined-efi.img.gz"
          test -s "$FIRMWARE"
          ls -lh "$FIRMWARE"

      # upload-artifact downloads as a ZIP. Since path points to one file only,
      # the ZIP contains only openwrt-x86-64-generic-squashfs-combined-efi.img.gz.
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaotan-openwrt-${{ env.OPENWRT_REF }}-${{ github.run_number }}
          path: work/openwrt/bin/targets/x86/64/openwrt-x86-64-generic-squashfs-combined-efi.img.gz
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

      - name: Publish GitHub Release for tags
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          FIRMWARE="work/openwrt/bin/targets/x86/64/openwrt-x86-64-generic-squashfs-combined-efi.img.gz"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FIRMWARE" --clobber
          else
            gh release create "$TAG" "$FIRMWARE" \
              --title "$TAG" \
              --generate-notes
          fi
